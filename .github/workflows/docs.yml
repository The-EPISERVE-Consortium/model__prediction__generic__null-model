name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'documentation/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'documentation/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: documentation/package-lock.json

      - name: Install
        run: npm ci
        working-directory: documentation

      - name: Check Mermaid diagrams
        run: npm run check:mermaid
        working-directory: documentation

      - name: Check LLM indexes are current
        run: |
          python3 scripts/build_llms.py
          git diff --exit-code -- llms-full.txt public/llms.txt public/llms-full.txt
        working-directory: documentation

      - name: Build
        run: npm run build
        working-directory: documentation
        env:
          # Project Pages live under /<repo>/; remove this for a custom domain.
          DOCS_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: documentation/.vitepress/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
